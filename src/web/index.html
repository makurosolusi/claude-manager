<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>claude-manager</title>
    <!-- Applies a stored theme choice before first paint (no flash). Key and values must match components/theme.toggle.tsx. -->
    <script>
      try {
        var t = localStorage.getItem("cm-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {
        // Storage blocked (private mode, sandbox): keep following the OS theme.
      }
    </script>
    <!-- Favicon link is injected at runtime: Bun's HTML bundler tries to resolve a root-absolute href as a file and fails; the server serves /favicon.svg (src/server/favicon.ts). -->
    <script>
      var icon = document.createElement("link");
      icon.rel = "icon";
      icon.type = "image/svg+xml";
      icon.href = "/favicon.svg";
      document.head.appendChild(icon);
    </script>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
