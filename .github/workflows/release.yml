name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Bun cross-compiles every target from Linux, so one runner builds them all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Pin to packageManager so release binaries match the locally verified Bun build.
          bun-version-file: package.json

      - name: Check tag matches package.json version
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version (expected tag v$version)"
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run build:all

      - name: Checksums
        working-directory: dist
        run: sha256sum claude-manager-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --notes "Supported: macOS and Linux (x64, arm64). The Windows build (claude-manager-windows-x64.exe) is experimental and has no self-update." \
            dist/claude-manager-* dist/SHA256SUMS install.sh
